# Converte in ONNX altre voci italiane open source, per farle girare nel browser:
#  - Coqui VITS «mai_female» (Lisa Caputo) e «mai_male» (Riccardo Fasa), dataset M-AILABS
# Il risultato va nel ramo «voci-convertite»: da lì si scelgono le versioni da pubblicare.
name: Converti voci open source
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/converti-voci.yml']
permissions:
  contents: write
jobs:
  converti:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Installa gli strumenti
        run: |
          mkdir -p out
          pip install --quiet torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "coqui-tts<0.27" "transformers==4.46.3" "optimum[exporters]==1.23.3" onnx onnxscript onnxruntime soundfile click typer "torch==2.5.1" "torchaudio==2.5.1" --extra-index-url https://download.pytorch.org/whl/cpu
          pip list 2>/dev/null | grep -i -E "^(torch|coqui|transformers|onnx|onnxruntime|optimum)" | tee out/log-pip.txt || true
      - name: Coqui VITS italiano
        continue-on-error: true
        run: |
          set -euo pipefail
          for n in mai_female mai_male; do
            curl -fsSL -o /tmp/$n.zip "https://github.com/coqui-ai/TTS/releases/download/v0.6.1_models/tts_models--it--$n--vits.zip"
            unzip -q -o /tmp/$n.zip -d /tmp/$n
          done
          cat > /tmp/coqui.py <<'PY'
          import json, os, sys, glob, numpy as np
          from TTS.tts.configs.vits_config import VitsConfig
          from TTS.tts.models.vits import Vits
          from onnxruntime.quantization import quantize_dynamic, QuantType
          import onnxruntime as ort
          for n in ["mai_female", "mai_male"]:
              d = glob.glob(f"/tmp/{n}/*")[0]
              cfg = VitsConfig(); cfg.load_json(os.path.join(d, "config.json"))
              m = Vits.init_from_config(cfg); m.load_checkpoint(cfg, os.path.join(d, "model_file.pth"), eval=True)
              o = f"out/coqui-{n}"; os.makedirs(o, exist_ok=True)
              m.export_onnx(output_path=f"{o}/fp32.onnx", verbose=False)
              quantize_dynamic(f"{o}/fp32.onnx", f"{o}/int8.onnx", weight_type=QuantType.QUInt8)
              ch = m.tokenizer.characters
              idmap = {c: [ch.char_to_id(c)] for c in ch.vocab if c not in ("<BLNK>",)}
              blank = ch.char_to_id(ch.blank) if getattr(ch, "blank", None) else 0
              test = "ciao, come stai? il job entra nello spool."
              ids = m.tokenizer.text_to_ids(test)
              sess = ort.InferenceSession(f"{o}/fp32.onnx")
              print(n, [(i.name, i.shape) for i in sess.get_inputs()], [(x.name, x.shape) for x in sess.get_outputs()])
              conf = {"audio": {"sample_rate": cfg.audio.sample_rate}, "phoneme_type": "text", "text": {"lowercase": True, "ascii": True},
                      "phoneme_id_map": {**idmap, "^": [], "$": [], "_": [blank]}, "inference": {"noise_scale": 0.667, "length_scale": 1, "noise_w": 0.8},
                      "test": {"text": test, "ids": ids}, "inputs": [i.name for i in sess.get_inputs()], "vocab": ch.vocab, "blank": blank}
              json.dump(conf, open(f"{o}/config.json", "w"), ensure_ascii=False, indent=1)
              print(n, "blank", blank, "test ids", ids[:20])
          PY
          python /tmp/coqui.py 2>&1 | tee out/log-coqui.txt
          ls -laR out
      - name: Salva nel ramo voci-convertite
        if: always()
        run: |
          set -e
          mkdir -p out
          ls -laR out | tee out/log-files.txt || true
          cd out
          git init -q -b voci-convertite
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in $(find . -name "*.onnx" -size +90M); do split -b 45000000 -d -a 1 "$f" "$f.part" && rm "$f"; done
          git add -A
          git commit -q -m "Voci convertite in ONNX ($GITHUB_SHA)" || true
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" voci-convertite
